name: Diagnose File 25 Reviews 39-53 Payload

on:
  push:
    branches: ["feature/25a-25b-foundation"]
    paths:
      - ".github/workflows/review39-53-apply.yml"

permissions:
  contents: read

jobs:
  diagnose-payload:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact corrective branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/25a-25b-foundation

      - name: Print payload part hashes
        shell: bash
        run: |
          set -euo pipefail
          wc -c .review39-53/part-*
          sha256sum .review39-53/part-*
          cat .review39-53/part-* | base64 --decode > /tmp/file25-reviews39-53.tar.gz
          sha256sum /tmp/file25-reviews39-53.tar.gz
          gzip -tv /tmp/file25-reviews39-53.tar.gz
