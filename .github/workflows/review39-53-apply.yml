name: Apply File 25 Reviews 39-53

on:
  push:
    branches: ["feature/25a-25b-foundation"]
    paths:
      - ".github/workflows/review39-53-apply.yml"

permissions:
  contents: write

concurrency:
  group: file-25-review39-53-apply
  cancel-in-progress: false

jobs:
  apply-reviewed-series:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact corrective branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/25a-25b-foundation
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.3"
          coverage: none
          extensions: zip

      - name: Apply, verify, clean, and push exact Reviews 39-53 payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Sabri File 25 Review Bot"
          git config user.email "file25-review@users.noreply.github.com"

          cat .review39-53/part-* | base64 --decode > /tmp/file25-reviews39-53.tar.gz
          echo "29e9ac38c4cb00ffd7413125ca97e254ebce2fa2959bfbaf3d079efb77e86c38  /tmp/file25-reviews39-53.tar.gz" | sha256sum --check
          tar -xzf /tmp/file25-reviews39-53.tar.gz

          composer validate --strict --no-check-publish
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
          composer test
          node --check assets/js/public.js

          rm -rf .review39-53 .github/workflows/review39-53-apply.yml
          git add -A
          git commit -m "File 25 Reviews 39-53: fifteen corrective rounds"
          git push origin HEAD:feature/25a-25b-foundation
