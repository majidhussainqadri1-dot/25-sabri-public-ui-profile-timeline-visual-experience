name: File 25 Four-Round Review and Correction

on:
  push:
    branches: [feature/25a-25b-foundation]
    paths:
      - ".github/workflows/four-round-review.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: file25-four-round-review
  cancel-in-progress: true

jobs:
  review-fix:
    runs-on: ubuntu-latest
    outputs:
      final_sha: ${{ steps.final.outputs.sha }}
      review15_sha: ${{ steps.r15.outputs.sha }}
      review16_sha: ${{ steps.r16.outputs.sha }}
      review17_sha: ${{ steps.r17.outputs.sha }}
      review18_sha: ${{ steps.r18.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/25a-25b-foundation
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          extensions: zip
      - name: Configure commit identity
        run: |
          git config user.name "File 25 Review Bot"
          git config user.email "file25-review@users.noreply.github.com"

      - name: Review 15 and correction 15
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/r15.patch
          for f in tools/patches/review15.part*.b64; do base64 -d "$f" >> /tmp/r15.patch; done
          git apply --check /tmp/r15.patch
          git apply /tmp/r15.patch
          base64 -d tools/patches/review15-test.b64 > tests/review15-file08-contract.php
          base64 -d tools/patches/review15-doc.b64 > docs/FIFTEENTH-REVIEW-FILE08-OWNER-CONTRACT-2026-08-03.md
          rm tools/patches/review15.part*.b64 tools/patches/review15-test.b64 tools/patches/review15-doc.b64
          php -l includes/class-native-integration.php
          php -l includes/class-dependency-manager.php
          php tests/review15-file08-contract.php
          git add -A && git diff --cached --check
          git commit -m "File 25 review 15: enforce exact File 08 owner contract"
          git push origin HEAD:feature/25a-25b-foundation
      - id: r15
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Review 16 and correction 16
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/r16.patch
          for f in tools/patches/review16.part*.b64; do base64 -d "$f" >> /tmp/r16.patch; done
          git apply --check /tmp/r16.patch
          git apply /tmp/r16.patch
          base64 -d tools/patches/review16-test.b64 > tests/review16-file03-profile-media.php
          base64 -d tools/patches/review16-doc.b64 > docs/SIXTEENTH-REVIEW-FILE03-PROFILE-MEDIA-AUTHORITY-2026-08-03.md
          rm tools/patches/review16.part*.b64 tools/patches/review16-test.b64 tools/patches/review16-doc.b64
          php -l includes/class-profile-repository.php
          php -l includes/class-native-integration.php
          php tests/review16-file03-profile-media.php
          git add -A && git diff --cached --check
          git commit -m "File 25 review 16: enforce File 03 profile media authority"
          git push origin HEAD:feature/25a-25b-foundation
      - id: r16
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Review 17 and correction 17
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/r17.patch
          for f in tools/patches/review17.part*.b64; do base64 -d "$f" >> /tmp/r17.patch; done
          git apply --check /tmp/r17.patch
          git apply /tmp/r17.patch
          base64 -d tools/patches/review17-test.b64 > tests/review17-canonical-url-normalization.php
          base64 -d tools/patches/review17-doc.b64 > docs/SEVENTEENTH-REVIEW-CANONICAL-URL-NORMALIZATION-2026-08-03.md
          rm tools/patches/review17.part*.b64 tools/patches/review17-test.b64 tools/patches/review17-doc.b64
          php -l includes/class-timeline-service.php
          php tests/review17-canonical-url-normalization.php
          git add -A && git diff --cached --check
          git commit -m "File 25 review 17: normalize canonical timeline identity"
          git push origin HEAD:feature/25a-25b-foundation
      - id: r17
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Review 18 and correction 18
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/r18.patch
          for f in tools/patches/review18.part*.b64; do base64 -d "$f" >> /tmp/r18.patch; done
          git apply --check /tmp/r18.patch
          git apply /tmp/r18.patch
          base64 -d tools/patches/review18-test.b64 > tests/review18-section-cache-binding.php
          base64 -d tools/patches/review18-doc.b64 > docs/EIGHTEENTH-REVIEW-SECTION-CACHE-BINDING-2026-08-03.md
          rm tools/patches/review18.part*.b64 tools/patches/review18-test.b64 tools/patches/review18-doc.b64
          python3 - <<'PY'
          import json
          from pathlib import Path
          tests = [
              "@php tests/review15-file08-contract.php",
              "@php tests/review16-file03-profile-media.php",
              "@php tests/review17-canonical-url-normalization.php",
              "@php tests/review18-section-cache-binding.php",
          ]
          composer = Path("composer.json")
          data = json.loads(composer.read_text())
          scripts = data["scripts"]["test"]
          anchor = "@php tests/master-plan-reconciliation.php"
          idx = scripts.index(anchor)
          for test in reversed(tests):
              if test not in scripts:
                  scripts.insert(idx, test)
          composer.write_text(json.dumps(data, indent=2) + "\n")

          ci = Path(".github/workflows/ci.yml")
          text = ci.read_text()
          anchor_block = "      - name: Master Plan v3 authoritative-contract reconciliation\n        run: php tests/master-plan-reconciliation.php\n"
          insert = """      - name: Review 15 exact File 08 owner contract
        run: php tests/review15-file08-contract.php

      - name: Review 16 File 03 profile media authority
        run: php tests/review16-file03-profile-media.php

      - name: Review 17 canonical URL normalization
        run: php tests/review17-canonical-url-normalization.php

      - name: Review 18 public section cache binding
        run: php tests/review18-section-cache-binding.php

"""
          if insert not in text:
              text = text.replace(anchor_block, insert + anchor_block, 1)
          ci.write_text(text)

          changelog = Path("CHANGELOG.md")
          old = changelog.read_text()
          marker = "## 0.14.0 — Four Additional Review and Correction Rounds"
          block = """## 0.14.0 — Four Additional Review and Correction Rounds

- Review 15: enforced the exact File 08 `0.2.1` owner contract, contract introspection, field/exclusion declarations, and removed the legacy clinic helper fallback.
- Review 16: enforced File 03 `0.2.x` facade compatibility, constrained File 09 fallbacks, and validated profile media owner, purpose, type, image state, size, and same-site URL.
- Review 17: normalized default ports in canonical timeline identity and added deterministic final ordering ties.
- Review 18: bound request-local public-section cache identity to the complete bounded public profile projection.
- Added four dedicated regression suites and four review records.
- Hostinger staging, production, merge, deployment, and Founder acceptance remain pending.

"""
          if marker not in old:
              changelog.write_text(block + old)

          readme = Path("README.md")
          old = readme.read_text()
          marker = "## Four additional review-and-correction rounds"
          block = """
## Four additional review-and-correction rounds

The current corrective branch additionally enforces the exact File 08 public clinic owner contract, the File 03 profile/media authority boundary, normalized canonical timeline identity, and profile-bound request-local section caching. Four independent regression suites and review records cover these corrections. These are source and automated-test results only; Hostinger staging and production acceptance remain pending.
"""
          if marker not in old:
              readme.write_text(old.rstrip() + "\n" + block)
          PY
          php -l includes/class-section-service.php
          php tests/review18-section-cache-binding.php
          composer validate --strict --no-check-publish
          composer test
          node --check assets/js/public.js
          rm .github/workflows/four-round-review.yml
          git add -A && git diff --cached --check
          git commit -m "File 25 review 18: bind section cache and record four-round QA"
          git push origin HEAD:feature/25a-25b-foundation
      - id: r18
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: final
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: review-fix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.0", "8.3"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.review-fix.outputs.final_sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: zip
      - run: |
          composer validate --strict --no-check-publish
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
          composer test
          node --check assets/js/public.js

  package:
    needs: [review-fix, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.review-fix.outputs.final_sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          extensions: zip
      - name: Build and verify deterministic candidate
        shell: bash
        run: |
          set -euo pipefail
          version=$(php -r '$s=file_get_contents("sabri-public-experience.php"); preg_match("/^\\s*\\* Version:\\s*([^\\s]+)/m",$s,$m); echo $m[1];')
          epoch=$(git show -s --format=%ct HEAD)
          sha=$(git rev-parse HEAD)
          php tools/build-staging-package.php --output-dir=build/a --commit="$sha" --source-date-epoch="$epoch"
          php tools/build-staging-package.php --output-dir=build/b --commit="$sha" --source-date-epoch="$epoch"
          base="sabri-public-experience-${version}"
          cmp "build/a/${base}.zip" "build/b/${base}.zip"
          cmp "build/a/${base}-manifest.json" "build/b/${base}-manifest.json"
          cmp "build/a/${base}.sha256" "build/b/${base}.sha256"
          mkdir -p build/artifact
          cp "build/a/${base}.zip" build/artifact/
          cp "build/a/${base}.sha256" build/artifact/
          cp "build/a/${base}-manifest.json" build/artifact/
          cp config/staging-dependencies.json build/artifact/
          php tools/verify-staging-artifact.php --artifact=build/artifact
      - uses: actions/upload-artifact@v4
        with:
          name: file-25-four-round-review-${{ needs.review-fix.outputs.final_sha }}
          path: build/artifact/
          if-no-files-found: error
          retention-days: 14

  record:
    needs: [review-fix, verify, package]
    runs-on: ubuntu-latest
    steps:
      - name: Record four-round evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          body=$(cat <<EOF
          ## Four separate review-and-correction rounds completed

          - Review 15: `${{ needs.review-fix.outputs.review15_sha }}`
          - Review 16: `${{ needs.review-fix.outputs.review16_sha }}`
          - Review 17: `${{ needs.review-fix.outputs.review17_sha }}`
          - Review 18 / final exact candidate: `${{ needs.review-fix.outputs.review18_sha }}`
          - Workflow run: `${{ github.run_id }}`

          PHP 8.0, PHP 8.3, JavaScript, the complete Composer suite, deterministic double-build, and independent artifact verification passed. Hostinger staging, production approval, merge, live deployment, and Founder acceptance remain pending.
          EOF
          )
          gh api "repos/${GITHUB_REPOSITORY}/issues/1/comments" -f body="$body"
