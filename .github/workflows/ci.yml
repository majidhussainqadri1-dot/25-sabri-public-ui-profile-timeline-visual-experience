name: Diagnose File 25 Reviews 94-133 Payload

on:
  push:
    branches: ["feature/25a-25b-foundation"]
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/25a-25b-foundation
      - name: Print chunk and character validation
        shell: bash
        run: |
          set -euo pipefail
          wc -c .review94-133/chunk-*
          sha256sum .review94-133/chunk-*
          grep -nHv '^[A-Za-z0-9+/=]*$' .review94-133/chunk-* || true
          cat .review94-133/chunk-* | base64 --decode > /tmp/reviews94-133-payload.tar.gz || true
          sha256sum /tmp/reviews94-133-payload.tar.gz
