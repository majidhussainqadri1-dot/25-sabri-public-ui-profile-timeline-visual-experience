name: File 25 Reviews 39-53 Payload Diagnosis

on:
  push:
    branches: ["feature/25a-25b-foundation"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: file-25-review39-53-diagnosis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose-payload:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/25a-25b-foundation

      - name: Verify every payload part
        shell: bash
        run: |
          set -euo pipefail
          wc -c .review39-53/part-*
          sha256sum .review39-53/part-*
          cat > /tmp/expected.sha256 <<'EOF'
          d0ff909b6f61dbc617ca7dbdc38d66e451cc5d1e27f5fe4619946107836dff11  .review39-53/part-00
          019a9b2a13a2e46d9de315331ba46ec695feb7e3f0009eb40913159a48f79ead  .review39-53/part-01
          8f48c985c6eb0051723446c4965ebcae4f92942b312c338fbb55f020431c9298  .review39-53/part-02
          a94becbbacd3db48b82cc332889540f2ef312a7617ef036852d2aca885945c7a  .review39-53/part-03
          7fdad61aac28114a49fdc1848cf26803a45de61cc6a361b01509abf0d1b42b9c  .review39-53/part-04
          a2208f7841cf05296fabff39ea7babdb36220a0b37b686b799029a32e8713767  .review39-53/part-05
          a92980e1547b25cb07d20b449b2d9f6dd67bbd3246e5ac3b18fd26f671947cdf  .review39-53/part-06
          EOF
          sha256sum --check /tmp/expected.sha256
