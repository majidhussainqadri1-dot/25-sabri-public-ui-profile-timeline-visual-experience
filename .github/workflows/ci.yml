name: Apply File 25 Reviews 54-93

on:
  push:
    branches: ["feature/25a-25b-foundation"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: file-25-review54-93-apply-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-reviewed-series:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact corrective branch
        uses: actions/checkout@v4
        with:
          ref: feature/25a-25b-foundation
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          extensions: zip

      - name: Apply, verify, and push forty corrected review rounds
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f .review54-93/part-00 ]]; then
            echo "Reviews 54-93 payload already applied; no-op."
            exit 0
          fi

          git config user.name "Sabri File 25 Review Bot"
          git config user.email "file25-review@users.noreply.github.com"

          cat .review54-93/part-* | base64 --decode > /tmp/file25-review54-93.tar.gz
          echo "fbd6ee0ef55738058d167b99053513fd43f7762128a270bde5175465953e5bad  /tmp/file25-review54-93.tar.gz" | sha256sum --check
          test "$(tar -tzf /tmp/file25-review54-93.tar.gz | wc -l)" -eq 54
          tar -xzf /tmp/file25-review54-93.tar.gz

          # Release-engineering tests inspect the canonical read-only workflow,
          # not this temporary write-enabled applicator.
          cp .github/workflows/ci.yml /tmp/review54-93-applicator.yml
          git show b7095671a6dad5a7af5fa2ebb0d1b0a6d9803125:.github/workflows/ci.yml > .github/workflows/ci.yml

          composer validate --strict --no-check-publish
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
          composer test
          node --check assets/js/public.js

          cp /tmp/review54-93-applicator.yml .github/workflows/ci.yml
          rm -rf .review54-93
          git add -A
          git reset .github/workflows/ci.yml
          git commit -m "File 25 Reviews 54-93: forty corrective rounds"
          git push origin HEAD:feature/25a-25b-foundation
