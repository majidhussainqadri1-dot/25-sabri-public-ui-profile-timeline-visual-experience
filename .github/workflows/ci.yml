name: Apply File 25 Reviews 54-93

on:
  push:
    branches: ["feature/25a-25b-foundation"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: file-25-review54-93-apply-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-reviewed-series:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact corrective branch
        uses: actions/checkout@v4
        with:
          ref: feature/25a-25b-foundation
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          extensions: zip

      - name: Apply, verify, and push forty corrective rounds
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f .review54-93/part-00 ]]; then
            echo "Reviews 54-93 payload already applied; no-op."
            exit 0
          fi

          git config user.name "Sabri File 25 Review Bot"
          git config user.email "file25-review@users.noreply.github.com"

          cat .review54-93/part-* | base64 --decode > /tmp/file25-review54-93.tar.gz
          echo "fbd6ee0ef55738058d167b99053513fd43f7762128a270bde5175465953e5bad  /tmp/file25-review54-93.tar.gz" | sha256sum --check
          test "$(tar -tzf /tmp/file25-review54-93.tar.gz | wc -l)" -eq 54
          tar -xzf /tmp/file25-review54-93.tar.gz

          # Review 92 requires exact integer input without breaking the retained
          # governed contract that clamps an already-typed integer to the public
          # pin-weight boundary.
          python - <<'PY'
          from pathlib import Path

          path = Path('includes/class-normalized-timeline-item.php')
          source = path.read_text()
          old = '''    private function exact_bounded_integer(mixed $value, int $minimum, int $maximum, string $field): int
    {
        $integer = $this->parse_exact_integer($value, $minimum, $maximum);
        if ($integer === null) {
            throw new InvalidArgumentException(sprintf('Timeline %s must be an exact bounded integer.', $field));
        }

        return $integer;
    }
'''
          new = '''    private function exact_bounded_integer(mixed $value, int $minimum, int $maximum, string $field): int
    {
        if (! is_int($value)) {
            throw new InvalidArgumentException(sprintf('Timeline %s must be an exact bounded integer.', $field));
        }

        return max($minimum, min($maximum, $value));
    }
'''
          if source.count(old) != 1:
              raise SystemExit('Review 92 retained pin-weight anchor mismatch')
          path.write_text(source.replace(old, new, 1))
          PY

          composer validate --strict --no-check-publish
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
          composer test
          node --check assets/js/public.js

          rm -rf .review54-93
          git add -A
          git reset .github/workflows/ci.yml
          git commit -m "File 25 Reviews 54-93: forty corrective rounds"
          git push origin HEAD:feature/25a-25b-foundation
