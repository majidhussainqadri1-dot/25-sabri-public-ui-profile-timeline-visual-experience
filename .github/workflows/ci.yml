name: File 25 CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: file-25-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-quality:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.0", "8.3"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: PHP syntax
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Reviewed timeline foundation contracts
        run: php tests/run.php

      - name: Immutable timeline provider object metadata contract
        run: php tests/timeline-provider-metadata.php

      - name: Structured public profile contracts
        run: php tests/profile-data.php

      - name: File 21 timeline adapter contract
        run: php tests/file21-provider.php

      - name: Global design system contract
        run: php tests/design-system.php

      - name: Reusable content card and URL security contract
        run: php tests/content-cards.php

      - name: Optional profile section provider contract
        run: php tests/section-providers.php

      - name: Provider object identity and atomic metadata contract
        run: php tests/section-provider-metadata.php

      - name: Native File 06 knowledge provider contract
        run: php tests/file06-knowledge-provider.php

      - name: Native File 10 11 12 media provider contracts
        run: php tests/file10-12-media-providers.php

      - name: Native File 18 Marketplace provider contract
        run: php tests/file18-marketplace-provider.php

      - name: Commit-bound artifact-integrity visual acceptance contract
        run: php tests/visual-acceptance.php

      - name: Deterministic staging package and dependency matrix contract
        run: php tests/release-engineering.php

      - name: Nested Safe Mode contract
        run: php tests/safe-mode.php

      - name: Package and local asset policy
        run: php tools/verify-structure.php

      - name: Native adapters and component completion package policy
        run: php tools/verify-file06-and-components.php

      - name: Concrete provider identity package policy
        run: php tools/verify-provider-metadata.php

  javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JavaScript syntax
        run: node --check assets/js/public.js

  staging-package:
    name: Deterministic staging candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up PHP with ZIP support
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          extensions: zip

      - name: Resolve immutable source inputs
        id: source
        shell: bash
        run: |
          set -euo pipefail
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build staging candidate twice
        shell: bash
        run: |
          set -euo pipefail
          php tools/build-staging-package.php \
            --output-dir=build/package-a \
            --commit='${{ steps.source.outputs.commit_sha }}' \
            --source-date-epoch='${{ steps.source.outputs.source_date_epoch }}'
          php tools/build-staging-package.php \
            --output-dir=build/package-b \
            --commit='${{ steps.source.outputs.commit_sha }}' \
            --source-date-epoch='${{ steps.source.outputs.source_date_epoch }}'

      - name: Verify reproducibility and detached evidence
        shell: bash
        run: |
          set -euo pipefail
          cmp build/package-a/sabri-public-experience-0.10.0.zip build/package-b/sabri-public-experience-0.10.0.zip
          cmp build/package-a/sabri-public-experience-0.10.0-manifest.json build/package-b/sabri-public-experience-0.10.0-manifest.json
          cmp build/package-a/sabri-public-experience-0.10.0.sha256 build/package-b/sabri-public-experience-0.10.0.sha256
          cd build/package-a
          sha256sum --check sabri-public-experience-0.10.0.sha256

      - name: Assemble downloadable candidate artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/artifact
          cp build/package-a/sabri-public-experience-0.10.0.zip build/artifact/
          cp build/package-a/sabri-public-experience-0.10.0.sha256 build/artifact/
          cp build/package-a/sabri-public-experience-0.10.0-manifest.json build/artifact/
          cp config/staging-dependencies.json build/artifact/

      - name: Upload staging candidate
        uses: actions/upload-artifact@v4
        with:
          name: file-25-staging-candidate-${{ steps.source.outputs.commit_sha }}
          path: build/artifact/
          if-no-files-found: error
          retention-days: 14
