name: Apply File 25 Review 14 Test Round 2

on:
  push:
    branches:
      - feature/25a-25b-foundation
    paths:
      - '.review14/test-round2.patch'
      - '.github/workflows/review14-apply-test-round2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/25a-25b-foundation
          fetch-depth: 0
      - name: Apply clinic ownership regression
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .review14/test-round2.patch
          git apply .review14/test-round2.patch
          php -l tests/authoritative-native-contracts.php
          php tests/authoritative-native-contracts.php
      - name: Commit regression and remove applicator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/authoritative-native-contracts.php
          git rm .review14/test-round2.patch .github/workflows/review14-apply-test-round2.yml
          git commit -m 'File 25 review 14 round 2: test File 08 clinic ownership [skip ci]'
          git push origin HEAD:feature/25a-25b-foundation
